name: hydrosovereign
channels:
  - conda-forge
  - pytorch
  - defaults

dependencies:
  # Python
  - python=3.12

  # Core scientific stack
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.10
  - scikit-learn>=1.3

  # Deep learning (CPU build)
  - pytorch::pytorch>=2.0
  - pytorch::cpuonly

  # Visualization
  - plotly>=5.18
  - matplotlib>=3.7

  # Web API
  - pip

  # Pip-only packages
  - pip:
    - hydrosovereign==6.5.0
    - fastapi>=0.110
    - uvicorn[standard]>=0.27
    - earthengine-api>=0.1.390
    - requests>=2.31
    - joblib>=1.3
    - pytest>=7.0
    - pytest-cov>=4.0

# Usage:
#   conda env create -f environment.yml
#   conda activate hydrosovereign
#   hydrosovereign list-basins
