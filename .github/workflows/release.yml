name: Release hydrosovereign to PyPI

# Trusted Publishing (OIDC) — no API token needed.
# Registered on PyPI as: Owner=saifeldinkhedir-coder,
# Repo=HydroSovereign-AI-Engine-HSAE-v601, Workflow=release.yml
#
# Triggers on a version tag push (e.g. v6.7.0) or manual dispatch.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  id-token: write   # REQUIRED for PyPI Trusted Publishing (OIDC)
  contents: read

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/hydrosovereign/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: python -m build --sdist --wheel

      - name: Verify distribution metadata
        run: twine check dist/*

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
          verbose: true
