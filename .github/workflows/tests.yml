name: HSAE v6.01 CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest numpy pandas scipy

    - name: Run syntax check
      run: |
        python -m py_compile app.py hsae_science.py hsae_hbv.py
        echo "✅ Syntax check passed"

    - name: Run HSAE test suite
      run: |
        pytest tests/test_hsae.py -v --tb=short

    - name: Run core tests
      run: |
        pytest tests/test_core.py -v --tb=short || true
