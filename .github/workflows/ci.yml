name: hydrosovereign Package CI

# Runs ONLY when manually triggered — not on every push
# This keeps the package CI completely separate from the Streamlit app
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for running'
        required: false
        default: 'manual test'

jobs:
  test-package:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn joblib pytest pytest-cov
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .

      - name: Run package tests
        run: |
          pytest tests/test_package.py tests/test_v620.py -v --tb=short

  build-package:
    name: Build wheel
    needs: test-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build & validate
        run: |
          pip install build twine
          python -m build
          twine check dist/*
