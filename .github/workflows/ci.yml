name: hydrosovereign Package CI

on:
  push:
    branches: [main]
    paths:
      - 'hydrosovereign/**'
      - 'pyproject.toml'
      - 'tests/test_package.py'
      - 'tests/test_v620.py'
  pull_request:
    branches: [main]
    paths:
      - 'hydrosovereign/**'

jobs:
  test-package:
    name: Test hydrosovereign package
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn pytest pytest-cov
          pip install -e .

      - name: Run package tests only
        run: |
          pytest tests/test_package.py tests/test_v620.py -v --tb=short
        continue-on-error: false

  build-package:
    name: Build & validate wheel
    needs: test-package
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Build wheel
        run: |
          pip install build twine
          python -m build

      - name: Validate wheel
        run: twine check dist/*
